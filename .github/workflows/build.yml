name: Build jar

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        working-directory: aurora-client-fabric-26.1.2/aurora-client
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: aurora-client-jar
          path: aurora-client-fabric-26.1.2/aurora-client/build/libs/*.jar
